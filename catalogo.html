  <style>
    :root{--wine:#401010;--cream:#fbf4ee;--line:#e8d7c8;--text:#3d2020;--pix-bg:#f7eee5}*{box-sizing:border-box}html,body{margin:0}body{font-family:"DM Sans",Arial,sans-serif;color:var(--text);background:var(--cream)}a{color:inherit;text-decoration:none}.wrap{width:min(1280px,calc(100% - 60px));margin:auto}.display{font-family:Italiana,Georgia,serif}.top{height:90px;background:var(--wine);color:#fff}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-family:"Cormorant Garamond",serif;font-size:30px;letter-spacing:-1px}.logo i{font-style:normal;color:#c5953e;font-size:43px;letter-spacing:-10px;vertical-align:-7px;margin:0 3px}.back{font-size:11px;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #c89959;padding-bottom:5px}.intro{padding:74px 0 48px;text-align:center;background:radial-gradient(circle at 50% 0,#fff 0,var(--cream) 73%)}.eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase}.intro h1{font-size:66px;line-height:.82;font-weight:400;letter-spacing:.06em;margin:12px 0 20px}.intro p{font-family:"Cormorant Garamond",serif;font-size:21px;line-height:1.3;max-width:500px;margin:auto}.catalog{padding:4px 0 82px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:23px}.card{display:block;background:#fffaf6;overflow:hidden;border:1px solid #f0e0d3}.product-photo{aspect-ratio:4/5;background:#f2e8df;overflow:hidden}.product-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}.card-info{padding:19px 20px 21px}.card-name{font-size:15px;letter-spacing:.15em;text-transform:uppercase}.card-code{font-size:10px;letter-spacing:.1em;margin-top:7px;color:#795c54}.catalog-prices{display:grid;gap:8px;margin-top:12px}.price-chip{display:grid;gap:3px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff}.price-chip-featured{background:linear-gradient(135deg,var(--wine),#5b1a1a);border-color:rgba(64,16,16,.9);box-shadow:0 8px 18px rgba(64,16,16,.16)}.price-chip-pix{background:var(--pix-bg)}.price-chip-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase}.price-chip-featured .price-chip-label{color:#ecdccf}.price-chip-pix .price-chip-label{color:#7c5b49}.price-chip-value{font-size:17px;line-height:1.05}.price-chip-featured .price-chip-value{color:#fff}.price-chip-pix .price-chip-value{color:var(--wine)}.price-chip-note,.price-chip-saving{font-size:10px;line-height:1.3}.price-chip-featured .price-chip-note{color:#e8cdbd}.price-chip-saving{color:#8b5a1d;font-weight:600}.price-chip-saving-neutral{color:#7c5b49;font-weight:500}.footer{background:var(--wine);color:#f4e5dc;padding:32px 0;text-align:center;font-size:10px;letter-spacing:.1em}@media(max-width:700px){.wrap{width:min(100% - 30px,1280px)}.top{height:72px}.logo{font-size:24px}.logo i{font-size:35px}.back{font-size:9px}.intro{padding:53px 0 34px;text-align:left}.intro h1{font-size:46px}.intro p{font-size:19px}.grid{grid-template-columns:1fr;gap:16px}}
  </style>
</head>
<body>
  <header class="top"><nav class="wrap nav"><a class="logo" href="index.html">DONA <i>///</i> GATTA</a><a class="back" href="index.html#colecoes">← Voltar para o site</a></nav></header>
  <main><section class="intro"><div class="wrap"><div class="eyebrow">Coleção</div><h1 class="display">CATÁLOGO GERAL</h1><p>Todas as nossas coleções</p></div></section><section class="catalog"><div class="wrap"><div class="grid" id="catalog-grid">
    <p style="grid-column: 1/-1; text-align: center;">Carregando catálogo...</p>
  </div></div></section></main>

    function parseBrazilianPrice(value){
      if(value==null) return NaN;
      const normalized=String(value).replace(/\s+/g,'').replace(/[R$r$\u00A0]/g,'').replace(/\./g,'').replace(',', '.').replace(/[^0-9.-]/g,'');
      return Number(normalized);
    }
    function formatBrazilianPrice(value){
      return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value);
    }
    function getCollectionPriceSummary(variacoes=[]){
      const valid=variacoes.map(v=>({
        parceladoRaw:v.valor_parcelado,
        vistaRaw:v.valor_vista,
        parcelado:parseBrazilianPrice(v.valor_parcelado),
        vista:parseBrazilianPrice(v.valor_vista)
      })).filter(v=>Number.isFinite(v.parcelado)||Number.isFinite(v.vista));
      if(!valid.length) return null;
      const featured=valid.filter(v=>Number.isFinite(v.parcelado)).sort((a,b)=>a.parcelado-b.parcelado)[0] || valid[0];
      const pix=valid.filter(v=>Number.isFinite(v.vista)).sort((a,b)=>a.vista-b.vista)[0] || valid[0];
      const savings=Number.isFinite(featured.parcelado)&&Number.isFinite(pix.vista)&&featured.parcelado>=pix.vista ? featured.parcelado-pix.vista : NaN;
      return { parceladoLabel: featured.parceladoRaw || '', vistaLabel: pix.vistaRaw || '', savings };
    }
    function buildPriceSummaryHTML(summary){
      const wrap = document.createElement('div');
      wrap.className = 'catalog-prices';
      const featured = document.createElement('div');
      featured.className = 'price-chip price-chip-featured';
      const featuredLabel = document.createElement('span');
      featuredLabel.className = 'price-chip-label';
      featuredLabel.textContent = 'Parcelado';
      const featuredValue = document.createElement('strong');
      featuredValue.className = 'price-chip-value';
      featuredValue.textContent = summary?.parceladoLabel || 'Consulte';
      const featuredNote = document.createElement('span');
      featuredNote.className = 'price-chip-note';
      featuredNote.textContent = 'Mais destaque para pagamento parcelado';
      featured.append(featuredLabel, featuredValue, featuredNote);

      const pix = document.createElement('div');
      pix.className = 'price-chip price-chip-pix';
      const pixLabel = document.createElement('span');
      pixLabel.className = 'price-chip-label';
      pixLabel.textContent = 'À vista no Pix';
      const pixValue = document.createElement('strong');
      pixValue.className = 'price-chip-value';
      pixValue.textContent = summary?.vistaLabel || 'Consulte';
      const pixSaving = document.createElement('span');
      pixSaving.className = `price-chip-saving ${Number.isFinite(summary?.savings)&&summary.savings>0?'':'price-chip-saving-neutral'}`;
      pixSaving.textContent = Number.isFinite(summary?.savings)&&summary.savings>0
        ? `Economize ${formatBrazilianPrice(summary.savings)} no Pix`
        : 'Melhor valor para pagamento à vista';

      wrap.append(featured, pix);
      return wrap;
    }
    async function loadCatalog() {
      if (!supabaseClient) return;
      const { data: collections, error } = await supabaseClient.from('colecoes').select('*, variacoes(valor_vista, valor_parcelado)').order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      
      const grid = document.getElementById('catalog-grid');
      if(collections.length === 0) {
          grid.replaceChildren();
          const empty = document.createElement('p');
          empty.style.gridColumn = '1/-1';
          empty.style.textAlign = 'center';
          empty.textContent = 'Nenhuma coleção disponível no momento.';
          grid.append(empty);
          return;
      }
      
      grid.replaceChildren();
      collections.forEach(c => {
        const card = document.createElement('a');

        const photo = document.createElement('div');
        photo.className = 'product-photo';
        const img = document.createElement('img');
        img.src = c.capa_url || '';
        img.width = 720;
        img.height = 900;
        img.alt = `Óculos ${c.nome}`;
        img.fetchPriority = 'high';
        img.decoding = 'async';
        photo.append(img);
        const info = document.createElement('div');
        info.className = 'card-info';
        const name = document.createElement('div');
        name.className = 'card-name';

        const code = document.createElement('div');
        code.className = 'card-code';
        code.textContent = 'Coleção Verão · Ver variações';

        card.append(photo, info);
