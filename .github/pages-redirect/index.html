<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3;url=https://dona-gatta.vercel.app/">
  <meta name="robots" content="noindex, nofollow">
  <title>Dona Gatta | Novo endereço</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fbf4ee; color: #401010; font-family: Arial, sans-serif; }
    main { width: min(560px, calc(100% - 48px)); text-align: center; }
    h1 { margin: 0; font: 400 clamp(3rem, 10vw, 5rem)/.9 Georgia, serif; letter-spacing: .05em; }
    p { margin: 28px auto; font-size: 1.1rem; line-height: 1.6; }
    a { display: inline-block; padding: 14px 20px; border: 1px solid #9f704d; color: inherit; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>DONA GATTA</h1>
    <p>Estamos em uma nova hospedagem. Você será direcionado(a) para o nosso novo endereço.</p>
    <a href="https://dona-gatta.vercel.app/">Acessar o novo site</a>
  </main>
  <script>window.setTimeout(() => location.replace('https://dona-gatta.vercel.app/'), 3000);</script>
</body>
</html>
