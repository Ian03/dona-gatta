<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel Administrativo — Dona Gatta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Italiana&display=swap" rel="stylesheet"><link rel="stylesheet" href="blob-admin.css"></head><body><main class="shell"><section id="loginCard" class="card login-card"><p class="eyebrow">DONA /// GATTA</p><h1>Painel administrativo</h1><p>Entre para gerenciar o catálogo e as imagens.</p><form id="loginForm"><label>Senha <input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="loginMessage" class="message" role="alert"></p></section><section id="adminApp" class="card app" hidden><header><div><p class="eyebrow">DONA /// GATTA</p><h1>Catálogo</h1></div><button id="logout" class="secondary">Sair</button></header><p class="hint">Edite os modelos em JSON. O site continua exibindo o catálogo local até o primeiro salvamento.</p><div class="toolbar"><button id="loadLocal" class="secondary">Usar catálogo local</button><label class="upload">Enviar imagem<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><span id="uploadStatus" class="message"></span></div><p class="hint">Após o upload, a URL será inserida onde estiver o cursor. Use-a em <code>capa_url</code> ou <code>imagem_url</code>.</p><textarea id="catalogEditor" spellcheck="false" aria-label="Conteúdo do catálogo"></textarea><div class="save-row"><span id="saveStatus" class="message"></span><button id="saveCatalog">Salvar catálogo</button></div></section></main><script src="local-catalog.js"></script><script src="blob-admin.js"></script></body></html>
